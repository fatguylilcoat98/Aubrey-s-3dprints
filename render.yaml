# PrintBuddy — The Good Neighbor Guard
# Render deployment. The whole app (static SPA + Mode 1/2 proxy) runs from
# this one Node web service. For a no-backend deploy (Modes 1 & 3 only via
# GitHub Pages / Netlify) just publish the /public folder as a static site.
services:
  - type: web
    name: printbuddy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Served behind thegoodneighborguard.com/printbuddy reverse proxy.
      # Makes assets + API resolve under the subpath. Remove (or set empty)
      # to serve PrintBuddy at the domain root instead.
      - key: BASE_PATH
        value: /printbuddy
      - key: TRIPO_API_KEY
        sync: false
      - key: MESHY_API_KEY
        sync: false
      - key: THINGIVERSE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
